# =============================================================================
# RAIO-X CLASSE CREATOR — Análise do Corpus Histórico (YouTube Black Box)
# =============================================================================
#
# Disparo: manual (Actions → Run workflow)
# O que faz:
#   1. Baixa os 893+ CSVs de github.com/FiSeveroo/coletor-youtube
#   2. Confirma data exata da ruptura (cat. 17 e 25)
#   3. Gera distribuição temporal semana a semana
#   4. Compara composição pré vs. pós agosto/2025
#   5. Gera 4 figuras para o artigo (PNG + PDF)
#   6. Commita tudo em resultados-analise/ neste repositório
# =============================================================================

name: Análise Corpus — YouTube Black Box

on:
  workflow_dispatch:
    inputs:
      limpar_cache:
        description: 'Ignorar cache e baixar tudo novamente do zero?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  analisar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests tqdm matplotlib seaborn numpy

      - name: Limpar cache (se solicitado)
        if: github.event.inputs.limpar_cache == 'true'
        run: rm -f resultados-analise/corpus_cache.parquet

      - name: Executar análise
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python analise_corpus.py

      - name: Commitar resultados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultados-analise/
          git diff --cached --quiet || git commit -m \
            "análise: corpus histórico $(date -u +%Y-%m-%d)"
          git push
