name: Analisar 50 vídeos recentes de um canal

on:
  workflow_dispatch:
    inputs:
      canal:
        description: "Handle do canal (@canal) ou Channel ID (UC...)"
        required: true
        type: string
      quantidade:
        description: "Quantidade de vídeos recentes, máximo 50"
        required: false
        default: "50"
        type: string

jobs:
  analisar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Analisar vídeos recentes do canal
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CHANNEL_INPUT: ${{ inputs.canal }}
          QUANTITY: ${{ inputs.quantidade }}
        run: |
          python - <<'PY'
          import csv
          import os
          import re
          import sys
          from typing import Any

          import requests


          API_KEY = os.environ.get("YOUTUBE_API_KEY", "").strip()
          CHANNEL_INPUT = os.environ.get("CHANNEL_INPUT", "").strip()

          try:
              QUANTITY = int(os.environ.get("QUANTITY", "50"))
          except ValueError:
              QUANTITY = 50

          QUANTITY = max(1, min(QUANTITY, 50))

          SHORT_MAX_SECONDS = 180
          MAX_WIDTH = 1000
          MAX_HEIGHT = 1000

          if not API_KEY:
              print("::error::YOUTUBE_API_KEY está ausente ou vazia.")
              sys.exit(1)

          if not CHANNEL_INPUT:
              print("::error::Informe o handle ou ID do canal.")
              sys.exit(1)


          def youtube_api(endpoint: str, params: dict[str, Any]) -> dict[str, Any]:
              response = requests.get(
                  f"https://www.googleapis.com/youtube/v3/{endpoint}",
                  params=params,
                  timeout=30,
              )

              if not response.ok:
                  print(
                      f"::error::Erro na API do YouTube "
                      f"({endpoint}): HTTP {response.status_code}"
                  )
                  print(response.text[:1000])
                  response.raise_for_status()

              return response.json()


          def parse_duration(duration: str | None) -> int:
              if not duration:
                  return 0

              match = re.fullmatch(
                  r"PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?",
                  duration,
              )

              if not match:
                  return 0

              hours, minutes, seconds = match.groups()

              return (
                  int(hours or 0) * 3600
                  + int(minutes or 0) * 60
                  + int(seconds or 0)
              )


          def positive_int(value: Any) -> int | None:
              try:
                  number = int(value)
                  return number if number > 0 else None
              except (TypeError, ValueError):
                  return None


          def resolve_channel(channel_input: str) -> dict[str, str]:
              if channel_input.startswith("UC"):
                  params = {
                      "part": "snippet,contentDetails",
                      "id": channel_input,
                      "key": API_KEY,
                  }
              else:
                  params = {
                      "part": "snippet,contentDetails",
                      "forHandle": channel_input.lstrip("@"),
                      "key": API_KEY,
                  }

              payload = youtube_api("channels", params)
              items = payload.get("items", [])

              if not items:
                  raise RuntimeError(
                      f"Nenhum canal encontrado para: {channel_input}"
                  )

              channel = items[0]
              snippet = channel.get("snippet") or {}
              content_details = channel.get("contentDetails") or {}
              related_playlists = (
                  content_details.get("relatedPlaylists") or {}
              )

              uploads_playlist = related_playlists.get("uploads")

              if not uploads_playlist:
                  raise RuntimeError(
                      "A API não retornou a playlist de uploads do canal."
                  )

              return {
                  "channel_id": channel["id"],
                  "channel_title": snippet.get("title", ""),
                  "uploads_playlist": uploads_playlist,
              }


          def get_recent_uploads(
              uploads_playlist: str,
              quantity: int,
          ) -> list[dict[str, Any]]:
              videos = []
              page_token = None

              while len(videos) < quantity:
                  params = {
                      "part": "snippet,contentDetails",
                      "playlistId": uploads_playlist,
                      "maxResults": min(50, quantity - len(videos)),
                      "key": API_KEY,
                  }

                  if page_token:
                      params["pageToken"] = page_token

                  payload = youtube_api("playlistItems", params)
                  items = payload.get("items", [])

                  if not items:
                      break

                  for item in items:
                      content_details = item.get("contentDetails") or {}
                      video_id = content_details.get("videoId")

                      if video_id:
                          videos.append(item)

                  if len(videos) >= quantity:
                      break

                  page_token = payload.get("nextPageToken")

                  if not page_token:
                      break

              return videos[:quantity]


          def classify_video(
              duration_seconds: int,
              embed_width: int | None,
              embed_height: int | None,
          ) -> dict[str, Any]:
              """
              Regra automatizada:

              - Até 180s e vertical: candidato automático a Short.
              - Até 180s e quadrado: não classificar como Short.
              - Até 180s e horizontal: não classificar como Short.
              - Mais de 180s: vídeo longo.
              """

              if duration_seconds > SHORT_MAX_SECONDS:
                  return {
                      "classification": "NAO_SHORT_LONGO",
                      "binary_result": "NAO_SHORT",
                      "format": "LONGO",
                      "reason": "duração acima de 180 segundos",
                      "aspect_ratio": None,
                  }

              if not embed_width or not embed_height:
                  return {
                      "classification": "INCONCLUSIVO",
                      "binary_result": "INCONCLUSIVO",
                      "format": "SEM_DADOS",
                      "reason": (
                          "duração curta, mas a API não retornou "
                          "as dimensões do player"
                      ),
                      "aspect_ratio": None,
                  }

              width = float(embed_width)
              height = float(embed_height)
              aspect_ratio = width / height

              # Vertical: a altura precisa ser maior que a largura.
              if height > width:
                  return {
                      "classification": "SHORT_AUTOMATICO",
                      "binary_result": "SHORT",
                      "format": "VERTICAL",
                      "reason": (
                          "duração <= 180s + player vertical"
                      ),
                      "aspect_ratio": aspect_ratio,
                  }

              # Aproximadamente 1:1: capas de álbum/visualizers.
              if 0.95 <= aspect_ratio <= 1.05:
                  return {
                      "classification": "NAO_SHORT_QUADRADO",
                      "binary_result": "NAO_SHORT",
                      "format": "QUADRADO",
                      "reason": (
                          "duração <= 180s + player quadrado"
                      ),
                      "aspect_ratio": aspect_ratio,
                  }

              # Horizontal normal ou ultrawide.
              if width > height:
                  if aspect_ratio >= 1.90:
                      video_format = "ULTRAWIDE"
                      classification = "NAO_SHORT_ULTRAWIDE"
                  else:
                      video_format = "HORIZONTAL"
                      classification = "NAO_SHORT_HORIZONTAL"

                  return {
                      "classification": classification,
                      "binary_result": "NAO_SHORT",
                      "format": video_format,
                      "reason": (
                          f"duração <= 180s + player "
                          f"{video_format.lower()}"
                      ),
                      "aspect_ratio": aspect_ratio,
                  }

              return {
                  "classification": "INCONCLUSIVO",
                  "binary_result": "INCONCLUSIVO",
                  "format": "DESCONHECIDO",
                  "reason": "proporção não reconhecida",
                  "aspect_ratio": aspect_ratio,
              }


          print("📺 Analisando vídeos recentes do canal")
          print(f"   Entrada: {CHANNEL_INPUT}")
          print(f"   Quantidade: {QUANTITY}")
          print()

          try:
              channel = resolve_channel(CHANNEL_INPUT)
          except Exception as error:
              print(f"::error::{error}")
              sys.exit(1)

          print(f"✅ Canal encontrado: {channel['channel_title']}")
          print(f"   ID: {channel['channel_id']}")
          print()

          upload_items = get_recent_uploads(
              channel["uploads_playlist"],
              QUANTITY,
          )

          if not upload_items:
              print("::error::Nenhum vídeo encontrado no canal.")
              sys.exit(1)

          video_ids = [
              item["contentDetails"]["videoId"]
              for item in upload_items
              if item.get("contentDetails", {}).get("videoId")
          ]

          print(f"   Vídeos recentes encontrados: {len(video_ids)}")
          print("🔍 Consultando dados atuais via videos.list")
          print("   part=snippet,contentDetails,player")
          print(f"   maxWidth={MAX_WIDTH}")
          print(f"   maxHeight={MAX_HEIGHT}")
          print()

          video_map = {}

          for start in range(0, len(video_ids), 50):
              batch = video_ids[start:start + 50]

              payload = youtube_api(
                  "videos",
                  {
                      "part": "snippet,contentDetails,player",
                      "id": ",".join(batch),
                      "maxWidth": MAX_WIDTH,
                      "maxHeight": MAX_HEIGHT,
                      "key": API_KEY,
                  },
              )

              for item in payload.get("items", []):
                  video_map[item["id"]] = item


          results = []

          for rank, video_id in enumerate(video_ids, start=1):
              item = video_map.get(video_id)

              if not item:
                  results.append(
                      {
                          "rank": rank,
                          "video_id": video_id,
                          "url": (
                              "https://www.youtube.com/watch?v="
                              f"{video_id}"
                          ),
                          "title": "",
                          "channel_title": channel["channel_title"],
                          "published_at": "",
                          "duration_iso": "",
                          "duration_seconds": "",
                          "embed_width": "",
                          "embed_height": "",
                          "player_dimensions": "SEM_DADOS",
                          "aspect_ratio": "",
                          "format": "SEM_DADOS",
                          "classification": "NAO_RETORNADO",
                          "binary_result": "INCONCLUSIVO",
                          "has_shorts_hashtag": "",
                          "reason": "vídeo não retornado pela API",
                      }
                  )
                  continue

              snippet = item.get("snippet") or {}
              content_details = item.get("contentDetails") or {}
              player = item.get("player") or {}

              title = snippet.get("title", "")
              description = snippet.get("description", "")
              tags = snippet.get("tags") or []
              duration_iso = content_details.get("duration", "")

              duration_seconds = parse_duration(duration_iso)

              embed_width = positive_int(player.get("embedWidth"))
              embed_height = positive_int(player.get("embedHeight"))

              player_dimensions = (
                  f"{embed_width}x{embed_height}"
                  if embed_width and embed_height
                  else "SEM_DADOS"
              )

              decision = classify_video(
                  duration_seconds,
                  embed_width,
                  embed_height,
              )

              searchable_text = (
                  f"{title} {description} {' '.join(tags)}"
              ).lower()

              has_shorts_hashtag = "#shorts" in searchable_text
              aspect_ratio = decision["aspect_ratio"]

              results.append(
                  {
                      "rank": rank,
                      "video_id": video_id,
                      "url": (
                          "https://www.youtube.com/watch?v="
                          f"{video_id}"
                      ),
                      "title": title,
                      "channel_title": snippet.get(
                          "channelTitle",
                          channel["channel_title"],
                      ),
                      "published_at": snippet.get(
                          "publishedAt",
                          "",
                      ),
                      "duration_iso": duration_iso,
                      "duration_seconds": duration_seconds,
                      "embed_width": embed_width or "",
                      "embed_height": embed_height or "",
                      "player_dimensions": player_dimensions,
                      "aspect_ratio": (
                          f"{aspect_ratio:.4f}"
                          if aspect_ratio is not None
                          else ""
                      ),
                      "format": decision["format"],
                      "classification": decision["classification"],
                      "binary_result": decision["binary_result"],
                      "has_shorts_hashtag": has_shorts_hashtag,
                      "reason": decision["reason"],
                  }
              )


          print(
              f"{'#':<4} "
              f"{'RESULTADO':<24} "
              f"{'DURAÇÃO':<9} "
              f"{'PLAYER':<14} "
              f"{'FORMATO':<11} "
              f"{'#SHORTS':<8} "
              "TÍTULO"
          )
          print("=" * 170)

          for row in results:
              print(
                  f"{row['rank']:<4} "
                  f"{row['classification']:<24} "
                  f"{str(row['duration_seconds']) + 's':<9} "
                  f"{row['player_dimensions']:<14} "
                  f"{row['format']:<11} "
                  f"{'SIM' if row['has_shorts_hashtag'] else 'NÃO':<8} "
                  f"{row['title'][:70]}"
              )
              print(f"  ↳ {row['url']}")
              print(f"  Motivo: {row['reason']}")
              print()


          def count_classification(name: str) -> int:
              return sum(
                  row["classification"] == name
                  for row in results
              )


          print("📊 RESUMO")
          print(f"   Canal: {channel['channel_title']}")
          print(f"   Vídeos analisados: {len(results)}")
          print(
              "   Shorts automáticos: "
              f"{count_classification('SHORT_AUTOMATICO')}"
          )
          print(
              "   Vídeos longos: "
              f"{count_classification('NAO_SHORT_LONGO')}"
          )
          print(
              "   Vídeos quadrados curtos: "
              f"{count_classification('NAO_SHORT_QUADRADO')}"
          )
          print(
              "   Vídeos horizontais curtos: "
              f"{count_classification('NAO_SHORT_HORIZONTAL')}"
          )
          print(
              "   Vídeos ultrawide curtos: "
              f"{count_classification('NAO_SHORT_ULTRAWIDE')}"
          )
          print(
              "   Inconclusivos: "
              f"{count_classification('INCONCLUSIVO')}"
          )
          print()
          print("ℹ️ A hashtag #shorts é apenas informativa.")
          print("ℹ️ A classificação usa dados atuais da API.")
          print("ℹ️ Nenhum dado do Supabase é usado.")


          csv_path = "videos_recentes_canal.csv"

          with open(
              csv_path,
              "w",
              newline="",
              encoding="utf-8",
          ) as csv_file:
              fieldnames = list(results[0].keys())
              writer = csv.DictWriter(
                  csv_file,
                  fieldnames=fieldnames,
              )
              writer.writeheader()
              writer.writerows(results)

          print(f"✅ CSV salvo em {csv_path}")
          PY

      - name: Publicar relatório CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-recentes-canal
          path: videos_recentes_canal.csv
          if-no-files-found: ignore
          retention-days: 14
