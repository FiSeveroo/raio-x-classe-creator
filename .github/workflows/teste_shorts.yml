name: Pesquisa Shorts por Search API

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: "Termo da busca do YouTube (ex.: shorts, shorts music, memes)"
        required: false
        default: "shorts"
        type: string
      region_code:
        description: "Região do YouTube (ex.: BR, US)"
        required: false
        default: "BR"
        type: string
      quantidade:
        description: "Quantidade de vídeos para consultar (máximo 50)"
        required: false
        default: "25"
        type: string

jobs:
  pesquisa:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Buscar Shorts na API do YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SEARCH_QUERY: ${{ inputs.search_query }}
          REGION_CODE: ${{ inputs.region_code }}
          QUANTITY: ${{ inputs.quantidade }}
        run: |
          python - <<'PY'
          import csv
          import os
          import re
          import sys
          from typing import Any

          import requests

          API_KEY = os.environ.get("YOUTUBE_API_KEY", "").strip()
          SEARCH_QUERY = os.environ.get("SEARCH_QUERY", "shorts").strip()
          REGION_CODE = os.environ.get("REGION_CODE", "BR").strip().upper() or "BR"

          try:
              QUANTITY = int(os.environ.get("QUANTITY", "25"))
          except ValueError:
              QUANTITY = 25

          QUANTITY = max(1, min(QUANTITY, 50))

          if not API_KEY:
              print("::error::YOUTUBE_API_KEY está ausente ou vazia.")
              sys.exit(1)

          SHORT_MAX_SECONDS = 180


          def parse_duration(duration: str | None) -> int:
              if not duration:
                  return 0

              match = re.fullmatch(
                  r"PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?",
                  duration,
              )

              if not match:
                  return 0

              hours, minutes, seconds = match.groups()
              return (
                  int(hours or 0) * 3600
                  + int(minutes or 0) * 60
                  + int(seconds or 0)
              )


          def get_int(value: Any) -> int | None:
              try:
                  return int(value)
              except (TypeError, ValueError):
                  return None


          def classify_video(
              duration_seconds: int,
              embed_width: int | None,
              embed_height: int | None,
          ) -> dict[str, Any]:
              # Vídeos longos
              if duration_seconds > SHORT_MAX_SECONDS:
                  return {
                      "classification": "NAO_SHORT_LONGO",
                      "binary_result": "NAO_SHORT",
                      "reason": "duração acima de 180 segundos",
                      "format": "LONGO",
                      "aspect_ratio": None,
                  }

              # Sem proporção do player
              if not embed_width or not embed_height:
                  return {
                      "classification": "INCONCLUSIVO",
                      "binary_result": "INCONCLUSIVO",
                      "reason": "duração curta, mas proporção do player indisponível",
                      "format": "SEM_DADOS",
                      "aspect_ratio": None,
                  }

              width = float(embed_width)
              height = float(embed_height)
              aspect_ratio = width / height

              # Vídeo vertical ou quase vertical
              if height > width * 1.05:
                  return {
                      "classification": "SHORT_AUTOMATICO",
                      "binary_result": "SHORT",
                      "reason": "duração <= 180s + player vertical",
                      "format": "VERTICAL",
                      "aspect_ratio": aspect_ratio,
                  }

              # Quadrado: água de música / capa de álbum / visual de música
              if 0.95 <= aspect_ratio <= 1.05:
                  return {
                      "classification": "NAO_SHORT_QUADRADO",
                      "binary_result": "NAO_SHORT",
                      "reason": "duração <= 180s + player quadrado",
                      "format": "QUADRADO",
                      "aspect_ratio": aspect_ratio,
                  }

              # Ultrawide / horizontais
              if width > height:
                  if aspect_ratio >= 1.90:
                      format_name = "ULTRAWIDE"
                      classificacao = "NAO_SHORT_ULTRAWIDE"
                  else:
                      format_name = "HORIZONTAL"
                      classificacao = "NAO_SHORT_HORIZONTAL"

                  return {
                      "classification": classificacao,
                      "binary_result": "NAO_SHORT",
                      "reason": f"duração <= 180s + formato {format_name.lower()}",
                      "format": format_name,
                      "aspect_ratio": aspect_ratio,
                  }

              return {
                  "classification": "INCONCLUSIVO",
                  "binary_result": "INCONCLUSIVO",
                  "reason": "proporção não reconhecida",
                  "format": "DESCONHECIDO",
                  "aspect_ratio": aspect_ratio,
              }


          print("🔎 Fazendo busca do YouTube")
          print(f"   Query: {SEARCH_QUERY}")
          print(f"   Região: {REGION_CODE}")
          print(f"   Quantidade: {QUANTITY}")
          print()

          search_response = requests.get(
              "https://www.googleapis.com/youtube/v3/search",
              params={
                  "part": "snippet",
                  "q": SEARCH_QUERY,
                  "type": "video",
                  "videoDuration": "short",
                  "regionCode": REGION_CODE,
                  "maxResults": QUANTITY,
                  "key": API_KEY,
              },
              timeout=30,
          )

          if not search_response.ok:
              print(
                  "::error::Falha na busca do YouTube: "
                  f"{search_response.status_code}"
              )
              print(search_response.text[:1000])
              search_response.raise_for_status()

          search_payload = search_response.json()
          items = search_payload.get("items", [])

          print(f"   Vídeos encontrados na busca: {len(items)}")
          print()

          if not items:
              print("::error::Nenhum vídeo encontrado para a busca.")
              sys.exit(1)

          video_ids = [
              item["id"]["videoId"]
              for item in items
              if item.get("id", {}).get("videoId")
          ]

          if not video_ids:
              print("::error::A busca retornou itens sem videoId.")
              sys.exit(1)

          print("📡 Consultando metadados dos vídeos retornados")
          video_lookup = requests.get(
              "https://www.googleapis.com/youtube/v3/videos",
              params={
                  "id": ",".join(video_ids),
                  "part": "snippet,contentDetails,player",
                  "maxWidth": 1000,
                  "maxHeight": 1000,
                  "key": API_KEY,
              },
              timeout=30,
          )

          if not video_lookup.ok:
              print(
                  "::error::Falha ao consultar videos.list: "
                  f"{video_lookup.status_code}"
              )
              print(video_lookup.text[:1000])
              video_lookup.raise_for_status()

          lookup_payload = video_lookup.json()
          video_items = lookup_payload.get("items", [])

          results = []

          for idx, item in enumerate(video_items, start=1):
              video_id = item.get("id", "")
              snippet = item.get("snippet") or {}
              content = item.get("contentDetails") or {}
              player = item.get("player") or {}

              title = snippet.get("title", "")
              description = snippet.get("description", "")
              tags = snippet.get("tags") or []

              duration_iso = content.get("duration", "")
              duration_seconds = parse_duration(duration_iso)

              embed_width = get_int(player.get("embedWidth"))
              embed_height = get_int(player.get("embedHeight"))

              if embed_width and embed_height:
                  player_dimensions = f"{embed_width}x{embed_height}"
              else:
                  player_dimensions = "SEM_DADOS"

              decision = classify_video(
                  duration_seconds,
                  embed_width,
                  embed_height,
              )

              aspect_ratio = decision["aspect_ratio"]
              aspect_text = (
                  f"{aspect_ratio:.4f}"
                  if aspect_ratio is not None
                  else ""
              )

              search_match = next(
                  (
                      entry
                      for entry in items
                      if entry.get("id", {}).get("videoId") == video_id
                  ),
                  None,
              )

              channel_title = (
                  snippet.get("channelTitle", "")
                  if snippet
                  else ""
              )

              searchable_text = (
                  f"{title} {description} {' '.join(tags)}"
              ).lower()
              has_shorts_hashtag = "#shorts" in searchable_text

              results.append(
                  {
                      "rank": idx,
                      "video_id": video_id,
                      "url": f"https://www.youtube.com/watch?v={video_id}",
                      "title": title,
                      "channel_title": channel_title,
                      "published_at": snippet.get("publishedAt", ""),
                      "duration_iso": duration_iso,
                      "duration_seconds": duration_seconds,
                      "embed_width": embed_width or "",
                      "embed_height": embed_height or "",
                      "player_dimensions": player_dimensions,
                      "aspect_ratio": aspect_text,
                      "format": decision["format"],
                      "classification": decision["classification"],
                      "binary_result": decision["binary_result"],
                      "has_shorts_hashtag": has_shorts_hashtag,
                      "reason": decision["reason"],
                  }
              )


          print(f"{'#':<4} {'RESULTADO':<24} {'DURAÇÃO':<9} {'PLAYER':<14} {'FORMATO':<11} {'#SHORTS':<8} TÍTULO")
          print("=" * 165)

          for row in results:
              print(
                  f"{row['rank']:<4} "
                  f"{row['classification']:<24} "
                  f"{str(row['duration_seconds']) + 's':<9} "
                  f"{row['player_dimensions']:<14} "
                  f"{row['format']:<11} "
                  f"{'SIM' if row['has_shorts_hashtag'] else 'NÃO':<8} "
                  f"{row['title'][:70]}"
              )
              print(f"  ↳ {row['url']}")
              print(f"  Motivo: {row['reason']}")
              print()

          shorts_count = sum(
              row["binary_result"] == "SHORT"
              for row in results
          )

          long_count = sum(
              row["binary_result"] == "NAO_SHORT"
              and row["classification"] == "NAO_SHORT_LONGO"
              for row in results
          )

          nao_short_quadrado = sum(
              row["classification"] == "NAO_SHORT_QUADRADO"
              for row in results
          )

          nao_short_horizontal = sum(
              row["classification"] == "NAO_SHORT_HORIZONTAL"
              for row in results
          )

          inconclusive_count = sum(
              row["binary_result"] == "INCONCLUSIVO"
              for row in results
          )

          print("📊 RESUMO")
          print(f"   Total consultado: {len(results)}")
          print(f"   Shorts automáticos: {shorts_count}")
          print(f"   Longos: {long_count}")
          print(f"   Não shorts em quadrado: {nao_short_quadrado}")
          print(f"   Não shorts horizontais: {nao_short_horizontal}")
          print(f"   Inconclusivos: {inconclusive_count}")
          print()
          print("ℹ️ Não há revisão manual nesta etapa.")
          print("ℹ️ O objetivo é detectar Shorts por estrutura oficial da API.")
          print("ℹ️ A hashtag #shorts é apenas uma evidência adicional.")

          csv_path = "shorts_search_result.csv"

          with open(csv_path, "w", newline="", encoding="utf-8") as csv_file:
              fieldnames = list(results[0].keys())
              writer = csv.DictWriter(csv_file, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(results)

          print(f"\n✅ CSV salvo em {csv_path}")
          PY

      - name: Publicar CSV de resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-search-result
          path: shorts_search_result.csv
          if-no-files-found: ignore
          retention-days: 14
