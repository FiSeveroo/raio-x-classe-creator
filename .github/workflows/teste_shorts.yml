name: Benchmark Shorts — 100 Mais Populares

on:
  workflow_dispatch:
    inputs:
      region_code:
        description: "País da lista de mais populares (ex.: BR, US)"
        required: false
        default: "BR"
        type: string
      quantidade:
        description: "Quantidade de vídeos a coletar (máximo 100)"
        required: false
        default: "100"
        type: string

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Buscar vídeos mais populares e analisar Shorts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REGION_CODE: ${{ inputs.region_code }}
          QUANTITY: ${{ inputs.quantidade }}
        run: |
          python - <<'PY'
          import csv
          import os
          import re
          import sys
          from typing import Any

          import requests

          API_KEY = os.environ.get("YOUTUBE_API_KEY", "").strip()
          REGION_CODE = os.environ.get("REGION_CODE", "BR").strip().upper() or "BR"

          try:
              quantity = int(os.environ.get("QUANTITY", "100"))
          except ValueError:
              quantity = 100

          quantity = max(1, min(quantity, 100))

          if not API_KEY:
              print("::error::YOUTUBE_API_KEY está ausente ou vazia.")
              sys.exit(1)

          def parse_duration(duration: str | None) -> int:
              if not duration:
                  return 0

              match = re.fullmatch(
                  r"PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?",
                  duration,
              )

              if not match:
                  return 0

              hours, minutes, seconds = match.groups()
              return (
                  int(hours or 0) * 3600
                  + int(minutes or 0) * 60
                  + int(seconds or 0)
              )

          def classify_video(
              duration_seconds: int,
              embed_width: int | None,
              embed_height: int | None,
          ) -> tuple[str, str, bool | None]:
              """Classificação experimental por duração + proporção do player."""
              if duration_seconds > 180:
                  return (
                      "PROVAVEL_LONGO",
                      "duração acima de 180s",
                      None if not embed_width or not embed_height
                      else embed_height >= embed_width,
                  )

              if not embed_width or not embed_height:
                  return (
                      "INCONCLUSIVO",
                      "duração até 180s, mas proporção indisponível",
                      None,
                  )

              if embed_height > embed_width:
                  return (
                      "CANDIDATO_SHORT_VERTICAL",
                      "duração até 180s + player vertical",
                      True,
                  )

              if embed_height == embed_width:
                  return (
                      "CANDIDATO_SHORT_QUADRADO",
                      "duração até 180s + player quadrado",
                      True,
                  )

              return (
                  "VIDEO_CURTO_HORIZONTAL",
                  "duração até 180s + player horizontal",
                  False,
              )

          def fetch_most_popular(target: int) -> list[dict[str, Any]]:
              videos = []
              seen_ids = set()
              page_token = None

              while len(videos) < target:
                  params = {
                      "chart": "mostPopular",
                      "regionCode": REGION_CODE,
                      "part": "snippet,contentDetails,player",
                      "maxResults": min(50, target - len(videos)),
                      "maxWidth": 1000,
                      "maxHeight": 1000,
                      "key": API_KEY,
                  }

                  if page_token:
                      params["pageToken"] = page_token

                  response = requests.get(
                      "https://www.googleapis.com/youtube/v3/videos",
                      params=params,
                      timeout=30,
                  )

                  if not response.ok:
                      print(
                          f"::error::YouTube API retornou HTTP {response.status_code}"
                      )
                      print(response.text[:1000])
                      response.raise_for_status()

                  payload = response.json()
                  items = payload.get("items", [])

                  if not items:
                      break

                  for item in items:
                      video_id = item.get("id")
                      if video_id and video_id not in seen_ids:
                          seen_ids.add(video_id)
                          videos.append(item)

                  next_page = payload.get("nextPageToken")
                  if not next_page or len(videos) >= target:
                      break

                  page_token = next_page

              return videos[:target]

          print("📡 Buscando vídeos mais populares no YouTube")
          print(f"   Região: {REGION_CODE}")
          print(f"   Quantidade solicitada: {quantity}")
          print("   Endpoint: videos.list?chart=mostPopular")
          print("   maxWidth: 1000 | maxHeight: 1000")
          print()

          items = fetch_most_popular(quantity)
          print(f"   Vídeos retornados: {len(items)}\n")

          if not items:
              print("::error::A API não retornou vídeos.")
              sys.exit(1)

          results = []

          for rank, item in enumerate(items, start=1):
              video_id = item.get("id", "")
              snippet = item.get("snippet") or {}
              content_details = item.get("contentDetails") or {}
              player = item.get("player") or {}

              title = snippet.get("title", "")
              description = snippet.get("description", "")
              tags = snippet.get("tags") or []
              duration_iso = content_details.get("duration") or ""
              duration_seconds = parse_duration(duration_iso)

              embed_width = player.get("embedWidth")
              embed_height = player.get("embedHeight")

              try:
                  embed_width = int(embed_width) if embed_width is not None else None
                  embed_height = int(embed_height) if embed_height is not None else None
              except (TypeError, ValueError):
                  embed_width = None
                  embed_height = None

              if embed_width and embed_height:
                  player_dimensions = f"{embed_width}x{embed_height}"
                  aspect_ratio = f"{embed_width / embed_height:.4f}"
              else:
                  player_dimensions = "SEM DADOS"
                  aspect_ratio = ""

              searchable_text = (
                  f"{title} {description} {' '.join(tags)}"
              ).lower()
              has_shorts_hashtag = "#shorts" in searchable_text

              classification, reason, vertical_or_square = classify_video(
                  duration_seconds,
                  embed_width,
                  embed_height,
              )

              predicted_binary = (
                  "short"
                  if classification in (
                      "CANDIDATO_SHORT_VERTICAL",
                      "CANDIDATO_SHORT_QUADRADO",
                  )
                  else "longo"
                  if classification == "PROVAVEL_LONGO"
                  else "inconclusivo"
              )

              results.append(
                  {
                      "rank": rank,
                      "video_id": video_id,
                      "url": f"https://www.youtube.com/watch?v={video_id}",
                      "title": title,
                      "channel_title": snippet.get("channelTitle", ""),
                      "published_at": snippet.get("publishedAt", ""),
                      "predicted_binary": predicted_binary,
                      "classification": classification,
                      "duration_iso": duration_iso,
                      "duration_seconds": duration_seconds,
                      "player_dimensions": player_dimensions,
                      "embed_width": embed_width or "",
                      "embed_height": embed_height or "",
                      "aspect_ratio": aspect_ratio,
                      "vertical_or_square": (
                          vertical_or_square
                          if vertical_or_square is not None
                          else ""
                      ),
                      "has_shorts_hashtag": has_shorts_hashtag,
                      "reason": reason,
                  }
              )

          print(
              f"{'#':<4} {'PRED':<13} {'DURAÇÃO':<9} "
              f"{'PLAYER':<14} {'#SHORTS':<8} TÍTULO"
          )
          print("=" * 145)

          for row in results:
              print(
                  f"{row['rank']:<4} "
                  f"{row['classification']:<13} "
                  f"{str(row['duration_seconds']) + 's':<9} "
                  f"{row['player_dimensions']:<14} "
                  f"{'SIM' if row['has_shorts_hashtag'] else 'NÃO':<8} "
                  f"{row['title'][:80]}"
              )
              print(f"  ↳ {row['url']}")
              print(f"  Motivo: {row['reason']}")

          shorts_candidates = sum(
              row["predicted_binary"] == "short" for row in results
          )
          long_candidates = sum(
              row["predicted_binary"] == "longo" for row in results
          )
          inconclusive = sum(
              row["predicted_binary"] == "inconclusivo" for row in results
          )

          print("\n📊 RESUMO")
          print(f"   Total analisado: {len(results)}")
          print(f"   Candidatos a Short: {shorts_candidates}")
          print(f"   Prováveis longos: {long_candidates}")
          print(f"   Inconclusivos: {inconclusive}")
          print("\nℹ️ A classificação é experimental e não é uma confirmação oficial do YouTube.")
          print("ℹ️ #shorts foi registrado como evidência, mas não é obrigatório.")

          csv_path = "mais_populares_shorts.csv"
          with open(csv_path, "w", newline="", encoding="utf-8") as csv_file:
              fieldnames = list(results[0].keys())
              writer = csv.DictWriter(csv_file, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(results)

          print(f"\n✅ CSV salvo em {csv_path}")
          PY

      - name: Publicar relatório CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mais-populares-shorts
          path: mais_populares_shorts.csv
          if-no-files-found: ignore
          retention-days: 14
