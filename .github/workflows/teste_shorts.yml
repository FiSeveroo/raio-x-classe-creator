name: Benchmark Shorts x Longos

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Testar 10 vídeos conhecidos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import re
          import requests
          import csv

          API_KEY = os.environ["YOUTUBE_API_KEY"]

          # Base conhecida de teste
          videos = [
              ("-pEoW7iNkgI", "longo"),
              ("R_UKPGu7Jt0", "longo"),
              ("ITm6R6W9ZoQ", "longo"),
              ("yLfMt8HIBZM", "short"),
              ("kpm7BJdgn0Y", "short"),
              ("PTYDcTKREtE", "short"),
              ("9U_hyEYFWA4", "short"),
              ("jlPnSpAPZvU", "longo"),
              ("fKF2HIjxtNA", "longo"),
              ("-ndOcHguPVw", "longo"),
          ]

          def parse_duration(duration: str | None) -> int:
              if not duration:
                  return 0
              m = re.fullmatch(r"PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?", duration)
              if not m:
                  return 0
              h = int(m.group(1) or 0)
              mi = int(m.group(2) or 0)
              s = int(m.group(3) or 0)
              return h * 3600 + mi * 60 + s

          def normalize(url_or_id: str) -> str:
              if "youtube.com" in url_or_id:
                  if "/shorts/" in url_or_id:
                      return url_or_id.split("/shorts/")[-1].split("&")[0].split("?")[0]
                  if "v=" in url_or_id:
                      return url_or_id.split("v=")[-1].split("&")[0]
              return url_or_id.split("&")[0].split("?")[0]

          def score_prediction(video):
              dur = video["duracao_seg"]
              vertical = video["vertical"]
              hashtag = video["hashtag_shorts"]
              title = video["titulo"].lower()
              desc = video["descricao"].lower()

              score = 0

              # Duração
              if dur <= 60:
                  score += 2
              elif dur <= 180:
                  score += 1
              elif dur > 600:
                  score -= 2

              # Formato/vertical
              if vertical is True:
                  score += 2
              elif vertical is False:
                  score -= 1

              # Hashtag curta
              if hashtag:
                  score += 2

              # Título/descrição
              if "shorts" in title or "shorts" in desc:
                  score += 1

              # Regra experimental
              if score >= 4:
                  return "SHORT"
              return "LONGO"

          batch = [normalize(v[0]) for v in videos]
          results = []

          # Consulta a API em lotes
          for i in range(0, len(batch), 50):
              chunk = ",".join(batch[i:i+50])
              r = requests.get(
                  "https://www.googleapis.com/youtube/v3/videos",
                  params={
                      "id": chunk,
                      "part": "snippet,contentDetails,player",
                      "key": API_KEY,
                  },
                  timeout=30,
              )
              r.raise_for_status()
              items = r.json().get("items", [])

              for item in items:
                  vid = item.get("id")
                  snippet = item.get("snippet", {})
                  content = item.get("contentDetails", {})
                  player = item.get("player", {})

                  titulo = snippet.get("title", "")
                  descricao = snippet.get("description", "")
                  tags = snippet.get("tags", [])
                  duracao = parse_duration(content.get("duration"))

                  embed_w = player.get("embedWidth")
                  embed_h = player.get("embedHeight")

                  if embed_w and embed_h:
                      vertical = embed_h > embed_w
                      ratio = f"{embed_w}x{embed_h}"
                  else:
                      vertical = None
                      ratio = "SEM DADOS"

                  texto = f"{titulo} {descricao} {' '.join(tags)}".lower()
                  hashtag_shorts = "#shorts" in texto

                  expected = next(label for video_id, label in videos if video_id == vid or normalize(video_id) == vid)
                  pred = score_prediction({
                      "duracao_seg": duracao,
                      "vertical": vertical,
                      "hashtag_shorts": hashtag_shorts,
                      "titulo": titulo,
                      "descricao": descricao,
                  })

                  results.append({
                      "video_id": vid,
                      "expected": expected,
                      "predicted": pred,
                      "duracao_seg": duracao,
                      "embed": ratio,
                      "vertical": vertical,
                      "hashtag_shorts": hashtag_shorts,
                      "titulo": titulo[:80],
                  })

          # Impressão
          print(f"{'ID':<14} {'REAL':<8} {'PRED':<8} {'DURA':<6} {'FORM':<14} {'#SHORTS':<7} TITULO")
          print("=" * 130)
          for row in results:
              print(
                  f"{row['video_id']:<14} "
                  f"{row['expected']:<8} "
                  f"{row['predicted']:<8} "
                  f"{str(row['duracao_seg'])+'s':<6} "
                  f"{str(row['embed']):<14} "
                  f"{'SIM' if row['hashtag_shorts'] else 'NAO':<7} "
                  f"{row['titulo']}"
              )

          # Estatísticas
          correct = sum(1 for r in results if r["expected"] == r["predicted"])
          total = len(results)
          print("\n📊 RESULTADO")
          print(f"   Acertos: {correct}/{total}")
          print(f"   Taxa: {correct/total*100:.1f}%")

          # Salva CSV
          with open("benchmark_shorts.csv", "w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=[
                  "video_id", "expected", "predicted", "duracao_seg", "embed", "vertical", "hashtag_shorts", "titulo"
              ])
              writer.writeheader()
              writer.writerows(results)

          print("\n✅ CSV salvo em benchmark_shorts.csv")

          PY

      - name: Upload do benchmark
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-shorts
          path: benchmark_shorts.csv
          retention-days: 7
