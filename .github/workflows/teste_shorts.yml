name: Teste — Detecção de Shorts

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase

      - name: Rodar teste de detecção de Shorts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # A secret key é usada aqui porque pode contornar RLS para leitura.
          # Ela nunca é impressa nem gravada no relatório.
          SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import csv
          import os
          import re
          import sys

          import requests
          from supabase import create_client


          def required_env(name):
              value = os.environ.get(name, "").strip()
              if not value:
                  raise RuntimeError(
                      f"A variável obrigatória {name} está ausente ou vazia."
                  )
              return value


          def parse_duration(duration):
              match = re.fullmatch(
                  r"PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?",
                  duration or "PT0S",
              )
              if not match:
                  return 0

              hours, minutes, seconds = match.groups()
              return (
                  int(hours or 0) * 3600
                  + int(minutes or 0) * 60
                  + int(seconds or 0)
              )


          try:
              api_key = required_env("YOUTUBE_API_KEY")
              supabase_url = required_env("SUPABASE_URL")
              supabase_key = required_env("SUPABASE_KEY")
              db = create_client(supabase_url, supabase_key)
          except Exception as error:
              print(f"::error::{error}")
              sys.exit(1)


          print("📦 Buscando os últimos 50 vídeos no Supabase...")
          print("   Tabela: classificacoes_video")
          print("   Acesso: SUPABASE_SECRET_KEY (somente leitura)\n")

          try:
              response = (
                  db.table("classificacoes_video")
                  .select("video_id, titulo, tipo_produtor, tipo_conteudo")
                  .order("id", desc=True)
                  .limit(50)
                  .execute()
              )
          except Exception as error:
              print(f"::error::Falha ao consultar o Supabase: {error}")
              sys.exit(1)

          videos_db = response.data or []
          print(f"   {len(videos_db)} vídeos encontrados no corpus\n")

          if not videos_db:
              print("❌ A consulta funcionou, mas a tabela não retornou registros.")
              print("   Verifique se classificacoes_video é a tabela correta e se possui dados.")
              sys.exit(1)

          videos_by_id = {
              video.get("video_id"): video
              for video in videos_db
              if video.get("video_id")
          }
          video_ids = list(videos_by_id)

          if not video_ids:
              print("❌ Os registros foram encontrados, mas nenhum possui video_id válido.")
              sys.exit(1)

          print("🔍 Consultando YouTube API (snippet + contentDetails + player)...\n")

          resultados = []

          for index in range(0, len(video_ids), 50):
              batch = video_ids[index:index + 50]
              response = requests.get(
                  "https://www.googleapis.com/youtube/v3/videos",
                  params={
                      "id": ",".join(batch),
                      "part": "snippet,contentDetails,player",
                      "maxWidth": 1920,
                      "key": api_key,
                  },
                  timeout=30,
              )
              response.raise_for_status()

              for item in response.json().get("items", []):
                  video_id = item["id"]
                  snippet = item.get("snippet", {})
                  content = item.get("contentDetails", {})
                  player = item.get("player", {})

                  titulo = snippet.get("title", "")
                  descricao = snippet.get("description", "")
                  tags = snippet.get("tags", [])
                  duracao = parse_duration(content.get("duration"))
                  embed_width = player.get("embedWidth")
                  embed_height = player.get("embedHeight")

                  texto = f"{titulo} {descricao} {' '.join(tags)}".lower()
                  tem_shorts = "#shorts" in texto

                  if embed_width and embed_height:
                      vertical = embed_height > embed_width
                      ratio = f"{embed_width}x{embed_height}"
                  else:
                      vertical = None
                      ratio = "SEM DADOS"

                  shorts_detectado = (
                      (vertical is True and duracao <= 180)
                      or tem_shorts
                  )

                  origem = videos_by_id.get(video_id, {})
                  resultados.append({
                      "video_id": video_id,
                      "url": f"https://www.youtube.com/watch?v={video_id}",
                      "titulo": titulo,
                      "duracao_seg": duracao,
                      "embed": ratio,
                      "vertical": vertical,
                      "hashtag_shorts": tem_shorts,
                      "classificacao": "PROVAVEL_SHORT" if shorts_detectado else "PROVAVEL_LONGO",
                      "tipo_produtor_supabase": origem.get("tipo_produtor", ""),
                      "tipo_conteudo_supabase": origem.get("tipo_conteudo", ""),
                  })

          resultados_por_id = {item["video_id"]: item for item in resultados}
          ids_nao_encontrados = [
              video_id for video_id in video_ids
              if video_id not in resultados_por_id
          ]

          print(f"{'CLASSIFICAÇÃO':<18} {'DURAÇÃO':<9} {'FORMATO':<14} {'#SHORTS':<9} TÍTULO")
          print("=" * 125)

          for resultado in resultados:
              vertical = resultado["vertical"]
              vertical_str = (
                  "VERTICAL" if vertical is True
                  else "HORIZONTAL" if vertical is False
                  else "SEM DADOS"
              )
              shorts_str = "SIM" if resultado["hashtag_shorts"] else "NÃO"
              duracao = f"{resultado['duracao_seg']}s"
              titulo = resultado["titulo"][:75]

              print(
                  f"{resultado['classificacao']:<18} "
                  f"{duracao:<9} "
                  f"{vertical_str:<14} "
                  f"{shorts_str:<9} "
                  f"{titulo}"
              )
              print(f"  ↳ {resultado['url']}")

          shorts_detectados = sum(
              item["classificacao"] == "PROVAVEL_SHORT"
              for item in resultados
          )
          sem_dados_player = sum(
              item["vertical"] is None for item in resultados
          )

          print("\n📊 RESUMO:")
          print(f"   Total encontrado no Supabase: {len(videos_db)}")
          print(f"   Total retornado pelo YouTube: {len(resultados)}")
          print(f"   Prováveis Shorts: {shorts_detectados}")
          print(f"   Prováveis Longos: {len(resultados) - shorts_detectados}")
          print(f"   Sem dados de player: {sem_dados_player}")
          print(f"   IDs não encontrados no YouTube: {len(ids_nao_encontrados)}")

          if ids_nao_encontrados:
              print("   IDs não encontrados:")
              for video_id in ids_nao_encontrados:
                  print(f"      {video_id}")

          with open("resultado_shorts.csv", "w", newline="", encoding="utf-8") as arquivo:
              campos = [
                  "video_id", "url", "titulo", "duracao_seg", "embed",
                  "vertical", "hashtag_shorts", "classificacao",
                  "tipo_produtor_supabase", "tipo_conteudo_supabase",
              ]
              writer = csv.DictWriter(arquivo, fieldnames=campos)
              writer.writeheader()
              writer.writerows(resultados)

          print("\n✅ Relatório salvo em resultado_shorts.csv")
          PY

      - name: Publicar relatório CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-deteccao-shorts
          path: resultado_shorts.csv
          if-no-files-found: ignore
          retention-days: 7
