name: Teste — Todas as Categorias YouTube API

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Executar teste completo
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python teste_todas_categorias.py
