# =============================================================================
# RAIO-X CLASSE CREATOR — Coleta Semanal Automatizada do Termômetro
# =============================================================================
#
# O workflow dispara 2x por dia (05h e 17h Brasília).
# O coletor.py decide se é o dia/horário correto da semana e só executa quando bate.
# Para forçar uma coleta extra fora do slot: "Run workflow" com FORCA_EXECUCAO=true.
# =============================================================================

name: Coleta Semanal — Termômetro do Em Alta

on:
  workflow_dispatch:
    inputs:
      forca_execucao:
        description: 'Forçar coleta fora do slot programado?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

  schedule:
    # GitHub Actions usa UTC. Brasília = UTC-3.
    # 08:00 UTC = 05:00 Brasília
    - cron: '0 8 * * *'
    # 20:00 UTC = 17:00 Brasília
    - cron: '0 20 * * *'

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar coleta
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FORCA_EXECUCAO: ${{ github.event.inputs.forca_execucao || 'false' }}
        run: python coletor.py
