# =============================================================================
# RAIO-X CLASSE CREATOR — Coleta Semanal Automatizada do Termômetro
# =============================================================================
#
# Este workflow roda automaticamente na nuvem do GitHub, sem custo nenhum.
# Ele alterna entre 14 horários diferentes ao longo de 14 semanas, replicando
# a metodologia da Tabela 02 da dissertação Severo (2026).
#
# Como funciona o agendamento:
#   - O cron abaixo dispara em TODOS os dias da semana, em DOIS horários
#     possíveis (08:00 UTC = 5h Brasília | 20:00 UTC = 17h Brasília)
#   - O script `coletor.py` calcula em qual slot da semana ISO estamos
#     e SÓ executa se o dia/horário atual bater com o slot programado
#
# Você também pode acionar manualmente pelo botão "Run workflow" na aba
# Actions do GitHub (útil para testar e para coletas extra).
# =============================================================================

name: Coleta Semanal — Termômetro do Em Alta

on:
  # Acionamento manual (botão na aba Actions do GitHub)
  workflow_dispatch:

  # Agendamento automático
  schedule:
    # GitHub Actions usa UTC. Brasília = UTC-3.
    # 08:00 UTC = 05:00 Brasília
    # 20:00 UTC = 17:00 Brasília
    # Roda em todos os dias, mas o coletor só executa no dia certo da semana.

    # Slot para semanas ÍMPARES (1, 3, 5...) — sempre 17h
    - cron: '0 20 * * 1'   # segunda 17h Brasília
    - cron: '0 20 * * 3'   # quarta 17h Brasília
    - cron: '0 20 * * 5'   # sexta 17h Brasília
    - cron: '0 20 * * 0'   # domingo 17h Brasília
    - cron: '0 20 * * 2'   # terça 17h Brasília
    - cron: '0 20 * * 4'   # quinta 17h Brasília
    - cron: '0 20 * * 6'   # sábado 17h Brasília

    # Slot para semanas PARES (2, 4, 6...) — sempre 5h
    - cron: '0 8 * * 2'    # terça 5h Brasília
    - cron: '0 8 * * 4'    # quinta 5h Brasília
    - cron: '0 8 * * 6'    # sábado 5h Brasília
    - cron: '0 8 * * 1'    # segunda 5h Brasília
    - cron: '0 8 * * 3'    # quarta 5h Brasília
    - cron: '0 8 * * 5'    # sexta 5h Brasília
    - cron: '0 8 * * 0'    # domingo 5h Brasília

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Coleta deve durar 3-5min; 30 é colchão de segurança

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar coleta
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python coletor.py
